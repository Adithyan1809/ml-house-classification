name: Real Estate ML CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Build Docker Container
        run: |
          docker build -t estate-classify:latest -f deploy/Dockerfile .

      - name: Container Health Verification
        run: |
          docker run -d -p 8501:8501 --name test-container estate-classify:latest
          sleep 10
          docker ps
          docker logs test-container
          docker stop test-container
